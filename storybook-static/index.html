<style>
  /* Adjust CitruSS brand logo to fit beautifully side-by-side with text */
  img[src*="citruss_logo_transparent.png"],
  .sidebar-header img,
  [data-testid="sidebar-brand-image"],
  .css-114r54w img {
    height: 48px !important;
    max-height: 48px !important;
    width: auto !important;
    object-fit: contain !important;
  }

  /* Style the brand link to act as a premium flex container */
  a[href*="github.com/umitunc/CitruSS"],
  [data-testid="sidebar-brand-link"],
  .sidebar-header a {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 12px !important;
    text-decoration: none !important;
    padding: 4px 8px !important;
    border-radius: 8px !important;
    transition: background 0.2s ease !important;
  }

  /* Custom styled container for title and slogan */
  .brand-text-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    pointer-events: none;
  }

  .brand-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #ff9f43 0%, #ff6b00 50%, #ff5252 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
  }

  .brand-slogan {
    font-size: 10px;
    font-weight: 500;
    color: #a3a9b6;
    letter-spacing: 0.3px;
    line-height: 1.2;
    margin-top: 2px;
    text-transform: uppercase;
    opacity: 0.8;
  }
</style>

<script>
  (function() {
    function injectBrandInfo() {
      const img = document.querySelector('img[src*="citruss_logo_transparent.png"]');
      if (img) {
        // Find the parent element (usually a or div)
        const parent = img.parentElement;
        if (parent && !parent.querySelector('.brand-text-container')) {
          const container = document.createElement('div');
          container.className = 'brand-text-container';

          const title = document.createElement('div');
          title.className = 'brand-title';
          title.innerText = 'CitruSS';

          const slogan = document.createElement('div');
          slogan.className = 'brand-slogan';
          slogan.innerText = 'Vibrant Glassmorphic UI';

          container.appendChild(title);
          container.appendChild(slogan);
          parent.appendChild(container);
        }
      }
    }

    // Run immediately and also poll to ensure it catches dynamic rendering
    injectBrandInfo();
    const interval = setInterval(injectBrandInfo, 100);

    // Stop polling after 10 seconds to save CPU, but register MutationObserver for resilient rendering
    setTimeout(() => {
      clearInterval(interval);
      
      const observer = new MutationObserver((mutations) => {
        injectBrandInfo();
      });
      
      if (document.body) {
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      }
    }, 10000);
  })();
</script>
